workflows:
  ios-build:
    name: iOS Build Workflow
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: 15.0.1  # Use specific Xcode version instead of "latest"
      cocoapods: 1.12.1
    scripts:
      # Step 1: Install Flutter dependencies
      - name: Install dependencies
        script: |
          cd Campus-Link/campuslink
          flutter clean
          flutter pub get

      # Step 2: Set iOS deployment target globally
      - name: Set iOS Deployment Target
        script: |
          cd Campus-Link/campuslink/ios
          # Set deployment target to 12.0 (more compatible than 13.0)
          export IPHONEOS_DEPLOYMENT_TARGET=12.0
          
          # Update Xcode project file
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 12.0;/g' Runner.xcodeproj/project.pbxproj
          
          # Also update any other deployment target references
          sed -i '' 's/MinimumOSVersion.*</MinimumOSVersion><string>12.0</string>/g' Runner/Info.plist 2>/dev/null || true

      # Step 3: Clean iOS build and pods completely
      - name: Clean iOS build
        script: |
          cd Campus-Link/campuslink/ios
          rm -rf Pods Podfile.lock Runner.xcworkspace .symlinks
          rm -rf ~/Library/Caches/CocoaPods
          rm -rf ~/.cocoapods/repos/trunk
          flutter clean

      # Step 4: Create proper Podfile with compatibility fixes
      - name: Configure Podfile
        script: |
          cd Campus-Link/campuslink/ios
          
          # Create a new Podfile with proper configuration
          cat > Podfile << 'EOF'
          platform :ios, '12.0'
          
          # CocoaPods analytics sends network stats synchronously affecting flutter build latency.
          ENV['COCOAPODS_DISABLE_STATS'] = 'true'
          
          project 'Runner', {
            'Debug' => :debug,
            'Profile' => :release,
            'Release' => :release,
          }
          
          def flutter_root
            generated_xcode_build_settings_path = File.expand_path(File.join('..', 'Flutter', 'Generated.xcconfig'), __FILE__)
            unless File.exist?(generated_xcode_build_settings_path)
              raise "#{generated_xcode_build_settings_path} must exist. If you're running pod install manually, make sure flutter pub get is executed first"
            end
          
            File.foreach(generated_xcode_build_settings_path) do |line|
              matches = line.match(/FLUTTER_ROOT\=(.*)/)
              return matches[1].strip if matches
            end
            raise "FLUTTER_ROOT not found in #{generated_xcode_build_settings_path}. Try deleting Generated.xcconfig, then run flutter pub get"
          end
          
          require File.expand_path(File.join('packages', 'flutter_tools', 'bin', 'podhelper'), flutter_root)
          
          flutter_ios_podfile_setup
          
          target 'Runner' do
            use_frameworks!
            use_modular_headers!
          
            flutter_install_all_ios_pods File.dirname(File.realpath(__FILE__))
          
            # Fix for arm64 simulator issues
            target 'RunnerTests' do
              inherit! :search_paths
            end
          end
          
          post_install do |installer|
            installer.pods_project.targets.each do |target|
              flutter_additional_ios_build_settings(target)
          
              # Fix deployment target for all pods
              target.build_configurations.each do |config|
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '12.0'
                config.build_settings['ENABLE_BITCODE'] = 'NO'
                config.build_settings['ARCHS[sdk=iphonesimulator*]'] = 'x86_64'
          
                # Remove problematic compiler flags
                config.build_settings.delete('GCC_OPTIMIZATION_LEVEL')
                config.build_settings.delete('SWIFT_OPTIMIZATION_LEVEL')
          
                # Fix for unsupported -G flag
                if config.build_settings['OTHER_CFLAGS']
                  config.build_settings['OTHER_CFLAGS'] = config.build_settings['OTHER_CFLAGS'].reject { |flag| flag.include?('-G') }
                end
                if config.build_settings['OTHER_CPLUSPLUSFLAGS']
                  config.build_settings['OTHER_CPLUSPLUSFLAGS'] = config.build_settings['OTHER_CPLUSPLUSFLAGS'].reject { |flag| flag.include?('-G') }
                end
              end
            end
          end
          EOF
          
          echo "Created Podfile:"
          cat Podfile

      # Step 5: Update CocoaPods and install with verbose output
      - name: Install Pods
        script: |
          cd Campus-Link/campuslink/ios
          
          # Update CocoaPods repo
          pod repo update
          
          # Install pods with specific architecture
          arch -x86_64 pod install --verbose --repo-update
          
          # If above fails, try regular install
          if [ $? -ne 0 ]; then
            echo "Retrying with regular pod install..."
            pod install --verbose
          fi

      # Step 6: Build iOS app with specific flags
      - name: Build iOS
        script: |
          cd Campus-Link/campuslink
          
          # Set environment variables for build
          export IPHONEOS_DEPLOYMENT_TARGET=12.0
          export ARCHS=arm64
          
          # Build with additional flags to avoid problematic optimizations
          flutter build ios \
            --debug \
            --no-codesign \
            --dart-define=FLUTTER_WEB_AUTO_DETECT=true \
            --target-platform ios-arm64

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log