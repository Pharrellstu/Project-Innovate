workflows:
  ios-build:
    name: iOS Build Workflow
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: 3.16.9  # Use older stable Flutter version
      xcode: 14.3.1    # Use older Xcode version to avoid toolchain issues
      cocoapods: default
    scripts:
      - name: Build iOS
        script: |
          cd Campus-Link/campuslink
          
          # Clean and get dependencies
          flutter clean
          flutter pub get
          
          # Set iOS deployment target to 11.0 (more compatible)
          cd ios
          sed -i '' 's/platform :ios, .*/platform :ios, '\''11.0'\''/' Podfile
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 11.0;/g' Runner.xcodeproj/project.pbxproj
          cd ..
          
          # Build with minimal flags
          flutter build ios --debug --no-codesign

    artifacts:
      - build/ios/ipa/*.ipa