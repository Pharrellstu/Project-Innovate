workflows:
  ios-build:
    name: iOS Build Workflow
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Install dependencies
        script: flutter pub get

      - name: Set iOS Deployment Target
        script: |
          cd ios
          if [ ! -f "Podfile" ]; then
            echo "platform :ios, '13.0'" > Podfile
          else
            sed -i '' "s/platform :ios, '[0-9]\+.[0-9]\+'/platform :ios, '13.0'/" Podfile
          fi
          cat Podfile

      - name: Build iOS
        script: flutter build ios --debug --no-codesign
