workflows:
  ios-build:
    name: iOS Build Workflow
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      # Step 1: Install Flutter dependencies
      - name: Install dependencies
        script: |
          cd $CM_BUILD_DIR
          flutter pub get

      # Step 2: Clean old iOS build and pods
      - name: Clean iOS build
        script: |
          cd $CM_BUILD_DIR/ios
          rm -rf Pods Podfile.lock

      # Step 3: Set iOS deployment target to 13
      - name: Set iOS Deployment Target
        script: |
          cd $CM_BUILD_DIR/ios

          # Patch Podfile
          if [ ! -f "Podfile" ]; then
            echo "platform :ios, '13.0'" > Podfile
          else
            sed -i '' "s/platform :ios, '[0-9]\+.[0-9]\+'/platform :ios, '13.0'/" Podfile
          fi

          # Patch all plugin podspecs to iOS 13
          find . -name "*.podspec" -exec sed -i '' "s/s.ios.deployment_target[ ]*=[ ]*'[0-9]\+.[0-9]\+'/s.ios.deployment_target = '13.0'/" {} \;

          cat Podfile

      # Step 4: Install pods
      - name: Install Pods
        script: |
          cd $CM_BUILD_DIR/ios
          pod install --repo-update

      # Step 5: Build iOS app
      - name: Build iOS
        script: |
          cd $CM_BUILD_DIR
          flutter build ios --debug --no-codesign
