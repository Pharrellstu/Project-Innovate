workflows:
  ios-build:
    name: iOS Build Workflow
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      # Step 1: Install Flutter dependencies
      - name: Install dependencies
        script: |
          cd Campus-Link/campuslink
          flutter pub get

      # Step 2: Clean iOS build
      - name: Clean iOS build
        script: |
          cd Campus-Link/campuslink
          flutter clean
          cd ios
          rm -rf Pods Podfile.lock Runner.xcworkspace

      # Step 3: Force iOS 13.0 deployment target in Xcode project
      - name: Force iOS 13.0 Deployment Target
        script: |
          cd Campus-Link/campuslink/ios
          
          # Update project.pbxproj deployment target
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 13.0;/g' Runner.xcodeproj/project.pbxproj
          
          # Update all build configurations
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 13.0;/g' Runner.xcodeproj/project.pbxproj
          
          # Also update any other deployment target settings
          sed -i '' 's/DEVELOPMENT_TEAM = [^;]*;//g' Runner.xcodeproj/project.pbxproj
          sed -i '' 's/MARKETING_VERSION = [^;]*;//g' Runner.xcodeproj/project.pbxproj

      # Step 4: Create proper Podfile with post_install hook
      - name: Configure Podfile
        script: |
          cd Campus-Link/campuslink/ios
          
          # Create or update Podfile with platform and post_install hook
          cat > Podfile << 'EOF'
          platform :ios, '13.0'
          use_frameworks!
          
          # Workaround for Cocoapods issue with Flutter
          use_modular_headers!
          
          target 'Runner' do
            flutter_install_all_ios_pods File.dirname(File.realpath(__FILE__))
          end
          
          post_install do |installer|
            installer.pods_project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '13.0'
                config.build_settings['EXCLUDED_ARCHS[sdk=iphonesimulator*]'] = 'arm64'
              end
            end
          end
          EOF
          
          cat Podfile

      # Step 5: Install pods with repo update
      - name: Install Pods
        script: |
          cd Campus-Link/campuslink/ios
          pod install --repo-update --verbose

      # Step 6: Check for plugins with old deployment targets
      - name: Check Plugin Deployment Targets
        script: |
          cd Campus-Link/campuslink/ios
          echo "Checking for plugins with old deployment targets..."
          find . -name "*.podspec" -exec grep -l "deployment_target" {} \; | xargs grep "deployment_target"
          find Pods -name "*.podspec" -exec grep -l "deployment_target" {} \; | xargs grep "deployment_target" || true

      # Step 7: Build iOS app with verbose output
      - name: Build iOS
        script: |
          cd Campus-Link/campuslink
          flutter build ios --debug --no-codesign --verbose