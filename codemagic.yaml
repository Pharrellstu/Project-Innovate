workflows:
  ios-build:
    name: iOS Build Workflow
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: 15.0.1
    scripts:
      - name: Install Flutter dependencies
        script: |
          cd Campus-Link/campuslink
          flutter clean
          flutter pub get

      - name: Configure iOS and Install Pods
        script: |
          # This script centralizes all iOS configuration into the Podfile.
          # This is the standard way to manage deployment targets and build settings.
          
          cd Campus-Link/campuslink/ios
          
          # Overwrite the Podfile to ensure our settings are used.
          # This includes the deployment target and crucial fixes for Xcode 15.
          cat > Podfile << 'EOF'
          # Set the platform and deployment target for the entire project.
          platform :ios, '12.0'
          
          # CocoaPods analytics sends network stats synchronously affecting flutter build latency.
          ENV['COCOAPODS_DISABLE_STATS'] = 'true'
          
          project 'Runner', {
            'Debug' => :debug,
            'Profile' => :release,
            'Release' => :release,
          }
          
          def flutter_root
            generated_xcode_build_settings_path = File.expand_path(File.join('..', 'Flutter', 'Generated.xcconfig'), __FILE__)
            unless File.exist?(generated_xcode_build_settings_path)
              raise "#{generated_xcode_build_settings_path} must exist. If you're running pod install manually, make sure flutter pub get is executed first"
            end
          
            File.foreach(generated_xcode_build_settings_path) do |line|
              matches = line.match(/FLUTTER_ROOT\=(.*)/)
              return matches[1].strip if matches
            end
            raise "FLUTTER_ROOT not found in #{generated_xcode_build_settings_path}. Try deleting Generated.xcconfig, then run flutter pub get"
          end
          
          require File.expand_path(File.join('packages', 'flutter_tools', 'bin', 'podhelper'), flutter_root)
          
          flutter_ios_podfile_setup
          
          target 'Runner' do
            use_frameworks!
            use_modular_headers!
          
            flutter_install_all_ios_pods File.dirname(File.realpath(__FILE__))
          end
          
          post_install do |installer|
            installer.pods_project.targets.each do |target|
              flutter_additional_ios_build_settings(target)
          
              target.build_configurations.each do |config|
                # Ensure every pod also uses the 12.0 deployment target.
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '12.0'
                config.build_settings['ENABLE_BITCODE'] = 'NO'
              end
            end
          end
          EOF
          
          # Install the pods using the system's reliable CocoaPods installation.
          pod install

      - name: Build iOS App
        script: |
          cd Campus-Link/campuslink
          # The --no-pod-install flag tells Flutter not to mess with our Pods,
          # as we have already installed them perfectly in the previous step.
          flutter build ios --debug --no-codesign --no-pod-install

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log